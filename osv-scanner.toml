reason = "braces@3.0.3 has no compatible reachable patch as of 2026-10-12 (advisory first_patched_version is empty; npm latest is 3.0.3). Reachability evidence: `pnpm why braces` shows one path, eslint-config-next@16.4.0 > @next/eslint-plugin-next@16.4.0 > fast-glob@3.3.1 > micromatch@4.0.8 > braces@3.0.3, dev-only. The plugin calls fast-glob only in dist/utils/get-root-dirs.js when settings.next.rootDir is set, and eslint.config.mjs does not set it. Approved on 2026-10-12. Remove this entry when braces publishes a patched 3.x release or when the path goes away."
